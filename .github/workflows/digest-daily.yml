name: Daily Digest

on:
  schedule:
    - cron: "0 23 * * *" # 07:00 SGT (UTC+8) every day
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if already built today"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  digest:
    name: Run daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        env:
          LEFTHOOK: "0"
        run: bun install --frozen-lockfile
      - name: Run daily digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          DIGEST_PICK_COUNT: ${{ vars.DIGEST_PICK_COUNT }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::error::TAVILY_API_KEY secret is not set"
            exit 1
          fi
          if ! { [ -n "$KV_REST_API_URL" ] && [ -n "$KV_REST_API_TOKEN" ]; } && ! { [ -n "$UPSTASH_REDIS_REST_URL" ] && [ -n "$UPSTASH_REDIS_REST_TOKEN" ]; }; then
            echo "::error::Upstash Redis credentials (KV_REST_API_URL/KV_REST_API_TOKEN or UPSTASH_REDIS_REST_URL/UPSTASH_REDIS_REST_TOKEN) are not set"
            exit 1
          fi
          if [ "$FORCE" = "true" ]; then
            bun run digest:daily -- --force
          else
            bun run digest:daily
          fi
