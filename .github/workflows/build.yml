name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tanstack-start-template:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size
        run: |
          SIZE=$(docker image inspect --format '{{.Size}}' tanstack-start-template:latest)
          echo "Image size: $SIZE bytes"
          if [ "$SIZE" -gt 419430400 ]; then
            echo "::error::Image size $SIZE bytes exceeds the 400MB (419430400 bytes) budget"
            exit 1
          fi
