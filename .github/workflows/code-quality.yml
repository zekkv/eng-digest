name: Code Quality

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, type check, and build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # drizzle.config.ts imports src/env.ts; both vars satisfy it for the migration checks.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/app
      BETTER_AUTH_SECRET: "template-migration-only-secret-000000"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Check formatting
        run: bun run format:check
      - name: Check linting and types
        run: bun run lint:check
      - name: Check types
        run: bun run type:check
      - name: Check migrations are generated
        run: bun run db:generate && git diff --exit-code -- src/db/drizzle
      - name: Check migration files
        run: bunx drizzle-kit check
      - name: Build for production
        run: bun run build
